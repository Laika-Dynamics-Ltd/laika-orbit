name: release laikaorbit
# Publishes the `laikaorbit` npm package when a tag like laikaorbit-v0.1.1 is pushed. The tag must match
# packages/laikaorbit/package.json's version. npm trusted publishing (OIDC) authenticates the run and
# attaches provenance, so there is no npm token in the repo's secrets.
on:
  push:
    tags: ['laikaorbit-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: pnpm install --frozen-lockfile

      - name: tag matches the package version
        run: |
          want="laikaorbit-v$(node -p "require('./packages/laikaorbit/package.json').version")"
          test "$GITHUB_REF_NAME" = "$want" || { echo "tag $GITHUB_REF_NAME, package says $want"; exit 1; }

      - name: smoke
        run: pnpm --filter laikaorbit smoke

      # pnpm pack writes the manifest npm users see (no workspace: specifiers); npm publishes it
      - name: publish
        working-directory: packages/laikaorbit
        run: |
          pnpm pack
          npm publish ./laikaorbit-*.tgz --provenance --access public
