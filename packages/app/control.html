<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent control</title>
    <!-- Matches index.html: the theme is set before the first paint. -->
    <script>try{var t=localStorage.getItem('orbit:theme');if(t&&t!=='midnight')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body class="ctl-page">
    <div id="ctl"></div>
    <script type="module" src="/src/control-page.ts"></script>
  </body>
</html>
